apply plugin: 'com.android.application'

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
// -PlogServerUrl=... on the command line wins over local.properties.
def logServerUrl = project.findProperty('logServerUrl') ?: localProps.getProperty('logServerUrl') ?: ''

android {
    namespace 'com.twilio.examplecustomlogger'
    compileSdkVersion versions.compileSdk
    buildToolsVersion versions.buildTools

    compileOptions {
        sourceCompatibility versions.java
        targetCompatibility versions.java
    }

    defaultConfig {
        applicationId "com.twilio.examplecustomlogger"
        minSdkVersion versions.minSdk
        targetSdkVersion versions.targetSdk
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "LOG_SERVER_URL", "\"${logServerUrl}\""
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation "com.twilio:voice-android:${versions.voiceAndroid}"
    implementation "com.google.android.material:material:${versions.material}"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.firebase:firebase-messaging:${versions.firebase}"
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
